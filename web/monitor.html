<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>API 余额监测</title>
<style>
:root{
  --bg:#11110f;--s:#181815;--line:#30302a;
  --text:#ebe9e1;--muted:#918f86;--dim:#65645d;
  --green:#78d47d;--warn:#e6c66a;--danger:#e28787;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua","Noto Serif SC","Songti SC","STSong",serif;
  --sans:Inter,"Segoe UI","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;overflow-y:auto}
.panel{width:100%;min-height:100vh;background:var(--s);border:0;border-radius:0 0 18px 18px;overflow:hidden}
main{padding:clamp(18px,3.4vw,26px) clamp(16px,3.4vw,26px) clamp(14px,2.6vw,20px)}
.top{display:flex;align-items:center;gap:clamp(14px,2.6vw,22px);margin-bottom:clamp(20px,4vw,30px)}
.balance-block{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:flex-start;gap:clamp(10px,2vw,16px)}
.label{color:var(--muted);font:clamp(11px,1.9vw,12px) var(--serif);margin-bottom:8px}
.balance{display:flex;align-items:baseline;gap:5px}
.symbol{font:clamp(19px,3.1vw,24px) var(--serif);color:#c8c6bd}
.number{font:500 clamp(42px,7vw,54px)/1 var(--serif);letter-spacing:-2px}
.currency{color:var(--muted);font:clamp(11px,1.9vw,12px) var(--serif);margin-left:3px}
.updated{margin-top:9px;color:var(--dim);font-size:10px}
.status{text-align:right;padding-top:4px}
.status-main{display:flex;align-items:center;justify-content:flex-end;gap:7px;color:var(--green);font:600 13px var(--serif)}
.status-main.err{color:var(--danger)}
.status-main.warn{color:var(--warn)}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.status-dot.err{background:var(--danger)}
.status-dot.warn{background:var(--warn)}
.status-sub{margin-top:6px;color:var(--dim);font-size:10px}
.ring{width:clamp(54px,9.5vw,64px);height:clamp(54px,9.5vw,64px);border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) 0 0%,#383833 0% 100%);position:relative}
.ring:after{content:"";position:absolute;inset:clamp(5px,0.9vw,6px);border-radius:50%;background:var(--s)}
.ring span{position:relative;z-index:1;font:600 clamp(11px,2.1vw,14px) var(--serif);color:var(--green)}
.ring.warn span,.ring.warn{color:var(--warn)}
.ring.danger span,.ring.danger{color:var(--danger)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:27px}
.metric{padding:0 clamp(12px,2.6vw,18px);border-left:1px solid var(--line)}
.metric:first-child{border-left:0;padding-left:0}
.metric:last-child{padding-right:0}
.metric-label{color:var(--muted);font:clamp(14px,2.4vw,15.6px) var(--serif);margin-bottom:clamp(6px,1.2vw,8px)}
.metric-value{font:500 clamp(24px,4.5vw,28.6px) var(--serif)}
.green{color:var(--green)}
.metric-foot{margin-top:clamp(5px,0.9vw,6px);color:var(--dim);font-family:var(--serif);font-size:clamp(12px,2vw,13px)}
.chart-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:13px}
.chart-title{font:600 15px var(--serif)}
.chart-caption{color:var(--dim);font:10px var(--serif);margin-top:3px}
.select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:#1c1c19 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='8' viewBox='0 0 8 8'><path d='M1 2.5 L4 5.5 L7 2.5' stroke='%23918f86' stroke-width='1.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 8px center;color:var(--muted);padding:6px 24px 6px 12px;border-radius:8px;font:11px var(--serif);outline:none;cursor:pointer;color-scheme:dark;transition:border-color .15s ease,color .15s ease,background-color .15s ease}
.select:hover{color:var(--text);border-color:#4e4e45;background-color:#232320}
.select:focus{color:var(--text);border-color:var(--green)}
.custom-range{display:flex;align-items:center;gap:8px;margin-bottom:10px;font:11px var(--serif);color:var(--dim)}
.custom-range input{background:#11110f;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:11px var(--serif);color-scheme:dark}
.chart{height:clamp(180px,38vh,230px);position:relative;border-bottom:1px solid var(--line);padding:clamp(18px,3vw,24px) 8px clamp(26px,4.4vw,32px) clamp(40px,7vw,50px);background:
  linear-gradient(to bottom, transparent 48.15%, rgba(255,255,255,.04) 48.35%, transparent 48.55%),
  transparent}
.chart::before{content:"";position:absolute;left:clamp(40px,7vw,50px);top:clamp(18px,3vw,24px);bottom:clamp(26px,4.4vw,32px);width:1px;background:var(--line);opacity:.55}
.y-axis{position:absolute;left:0;top:clamp(16px,2.8vw,20px);bottom:clamp(28px,4.6vw,34px);display:flex;flex-direction:column;justify-content:space-between;color:var(--dim);font:clamp(11px,1.9vw,12px) var(--serif);width:clamp(36px,6.2vw,46px)}
.y-axis span{display:block;text-align:right;padding-right:8px}
.bars{height:100%;display:grid;grid-template-columns:repeat(7,1fr);gap:12px;align-items:end}
.bar-wrap{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.bar-value{margin-bottom:6px;color:#aaa89f;font:clamp(11px,1.9vw,12px) var(--serif)}
.bar{width:clamp(26px,5vw,34px);max-width:75%;min-height:2px;border-radius:3px 3px 0 0;background:#4e824f}
.bar.current{background:var(--green)}
.bar-label{position:absolute;bottom:-26px;color:var(--dim);font:clamp(10px,1.8vw,11px) var(--serif);background:var(--s);padding:1px 5px;border-radius:3px;white-space:nowrap;line-height:1.2;z-index:2}
.bar-label.current{color:var(--text)}
.bottom{display:flex;justify-content:space-between;margin-top:13px;color:var(--dim);font:9px var(--serif)}
@media(max-width:520px){
  main{padding:21px 18px 17px}
  .top{display:block}
  .status{text-align:left;margin-top:14px}
  .status-main{justify-content:flex-start}
  .number{font-size:47px}
  .metrics{grid-template-columns:1fr;gap:14px}
  .metric{border-left:0!important;padding:0!important}
  .metric-foot{display:none}
}
</style>
</head>
<body>
<section class="panel">
<main>
  <!-- 圆环（左）+ 余额 + 状态 -->
  <section class="top">
    <div class="ring" id="ring"><span id="ringPct">--%</span></div>
    <div class="balance-block">
      <div>
        <div class="label">可用余额</div>
        <div class="balance">
          <span class="symbol" id="symbol">¥</span>
          <span class="number" id="number">—</span>
          <span class="currency" id="currency"></span>
        </div>
        <div class="updated" id="updated">最后检测 · —</div>
      </div>
      <div class="status">
        <div class="status-main" id="statusMain"><i class="status-dot" id="statusDot"></i><span id="statusText">等待数据…</span></div>
        <div class="status-sub" id="statusSub">—</div>
      </div>
    </div>
  </section>


  <!-- 三指标卡 -->
  <section class="metrics">
    <div class="metric">
      <div class="metric-label">今日消耗</div>
      <div class="metric-value" id="costToday" style="color:#fff">—</div>
      <div class="metric-foot" id="costTodayFoot" style="color:var(--dim)"></div>
    </div>
    <div class="metric">
      <div class="metric-label">近 7 日</div>
      <div class="metric-value" id="cost7d">—</div>
      <div class="metric-foot" id="cost7dFoot">—</div>
    </div>
    <div class="metric">
      <div class="metric-label">缓存命中</div>
      <div class="metric-value" id="cacheRate">—</div>
      <div class="metric-foot" id="cacheRateFoot">API Cache</div>
    </div>
  </section>

  <!-- 用量趋势：7 根柱 + 纵轴 -->
  <section>
    <div class="chart-head">
      <div>
        <div class="chart-title">用量趋势</div>
        <div class="chart-caption" id="chartCaption">过去 7 日 API Token 使用量</div>
      </div>
      <select class="select" id="rangeSelect">
        <option value="today">今天</option>
        <option value="yesterday">昨天</option>
        <option value="7d" selected>近 7 天</option>
        <option value="30d">近 30 天</option>
        <option value="month">本月</option>
        <option value="lastMonth">上月</option>
        <option value="custom">自定义</option>
      </select>
    </div>
    <div class="custom-range" id="customRange" style="display:none">
      <input type="date" id="fromDate">
      <span>至</span>
      <input type="date" id="toDate">
    </div>
    <div class="chart">
      <div class="y-axis" id="yAxis"><span>—</span><span>—</span><span>0</span></div>
      <div class="bars" id="bars"></div>
    </div>
    <footer class="bottom">
      <span>API Usage Monitor</span>
      <span id="updateTime">—</span>
    </footer>
  </section>
</main>
</section>
<script>
"use strict";

// ── 数据桥：宿主通过 window.chrome.webview.postMessage 推送 {theme, data} ──
// 页面自身不发任何网络请求（CORS 限制），数据全部来自 C# 拉取并推送。
var bridge = window.chrome && window.chrome.webview;
var currentUsage = [];
var currentRange = "7d";
var customFrom = "";
var customTo = "";

function fmtTokens(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
  return "" + n;
}

function applyRiskTone(el, ratio) {
  el.classList.remove("warn", "danger");
  if (ratio >= 1) el.classList.add("danger");
  else if (ratio >= 0.8) el.classList.add("warn");
}

function setText(id, t) { var el = document.getElementById(id); if (el) el.textContent = t; }

function render(msg) {
  if (!msg) return;
  var d = msg.data || {};

  // 顶部：余额
  var sym = d.currencySymbol || "";
  var amt = d.hasBalance ? d.balance : "—";
  setText("symbol", sym);
  setText("number", amt);
  setText("currency", d.currency || "");
  setText("updated", "最后检测 · " + (d.updateTime || "—"));

  // 状态点 + 文字
  var main = document.getElementById("statusMain");
  var dot = document.getElementById("statusDot");
  main.classList.remove("err", "warn");
  dot.classList.remove("err", "warn");
  if (d.statusKind === "ok") {
    setText("statusText", "在线");
    setText("statusSub", "当前状态正常");
  } else if (d.statusKind === "error") {
    main.classList.add("err"); dot.classList.add("err");
    setText("statusText", d.status || "错误");
    setText("statusSub", "请求异常");
  } else {
    main.classList.add("warn"); dot.classList.add("warn");
    setText("statusText", d.status || "未配置");
    setText("statusSub", "请在设置页填写");
  }

  // 健康度：圆环 + 进度条 + 颜色
  var ratio = d.ratio || 0;
  var pct = Math.round(Math.max(0, Math.min(ratio, 1)) * 100);
  setText("ringPct", (d.hasBalance && ratio > 0) ? pct + "%" : "--");
  var ring = document.getElementById("ring");
  ring.style.background = "conic-gradient(" +
    (d.riskColor || "#78d47d") + " 0 " + pct + "%, #383833 " + pct + "% 100%)";
  applyRiskTone(ring, ratio);
  document.getElementById("ring").firstElementChild && (document.getElementById("ring").firstElementChild.style.color = d.riskColor || "#78d47d");

  // 三指标卡
  setText("costToday", d.costToday || "—");
  var tFoot = document.getElementById("costTodayFoot");
  if (d.costTodayFoot) {
    tFoot.style.display = "";
    tFoot.innerHTML = "";
    // "相较昨日" 用正常弱色，箭头单独用 SVG（更明显），颜色按趋势
    var m = String(d.costTodayFoot).match(/^(相较昨日 )([↑↓→])(.*)$/);
    if (m) {
      var lbl = document.createElement("span");
      lbl.style.color = "var(--dim)";
      lbl.textContent = m[1];
      var arrow = document.createElement("span");
      arrow.style.color = m[2] === "↑" ? "var(--danger)" : (m[2] === "↓" ? "var(--green)" : "var(--dim)");
      arrow.innerHTML = trendSvg(m[2]) + m[3];
      tFoot.appendChild(lbl);
      tFoot.appendChild(arrow);
    } else {
      tFoot.textContent = d.costTodayFoot;
    }
  } else { tFoot.style.display = "none"; }
  setText("cost7d", d.cost7d || "—");
  var f7 = document.getElementById("cost7dFoot");
  if (d.cost7dFoot) { f7.textContent = d.cost7dFoot; f7.style.display = ""; }
  else { f7.style.display = "none"; }
  setText("cacheRate", d.cacheRate != null ? Math.round(d.cacheRate * 100) + "%" : "—");
  setText("cacheRateFoot", "API Cache · " + (d.cacheRate != null ? ("今日") : "无数据"));

  // 用量柱状图
  currentUsage = d.usage || [];
  renderChart();
  setText("updateTime", d.updateTime || "—");
}

// 选定时段重新过滤渲染（不重新请求 C#）
function bindRange() {
  var sel = document.getElementById("rangeSelect");
  if (!sel) return;
  // 同步 DOM 当前选中值到 currentRange（首次加载）
  currentRange = sel.value;
  function sync() {
    currentRange = sel.value;
    var cr = document.getElementById("customRange");
    if (cr) cr.style.display = (currentRange === "custom") ? "flex" : "none";
    renderChart();
  }
  // 多事件触发，确保 WebView2 / 其它环境都能响应
  sel.addEventListener("change", sync);
  sel.addEventListener("input", sync);
  sel.addEventListener("click", sync);
  sel.addEventListener("focus", function () { sel.style.borderColor = "var(--green)"; });
  sel.addEventListener("blur", function () { sel.style.borderColor = ""; });
  // 键盘事件（鼠标点击受限时可键盘切换）
  sel.addEventListener("keydown", function (e) {
    if (e.key === "ArrowUp" || e.key === "ArrowDown" ||
        e.key === "ArrowLeft" || e.key === "ArrowRight") {
      setTimeout(sync, 0);
    }
  });
  // 自定义日期
  document.getElementById("fromDate").addEventListener("change", function () { customFrom = this.value; renderChart(); });
  document.getElementById("toDate").addEventListener("change", function () { customTo = this.value; renderChart(); });
}
bindRange();
if (document.readyState !== "complete") {
  window.addEventListener("load", bindRange);
}

function parseDate(s) {
  var p = s.split("-");
  return new Date(+p[0], +p[1] - 1, +p[2]);
}

function renderChart() {
  var byDate = {};
  currentUsage.forEach(function (u) { byDate[u.date] = u.tokens; });
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var todayStr = fmtDateLocal(today);
  var items = [];
  function push(d, label) {
    items.push({ date: d, tokens: byDate[d] || 0, label: label, current: (d === todayStr) });
  }
  var caption = "";
  if (currentRange === "today") {
    push(todayStr, "今");
    caption = "今日 API Token 使用量";
  } else if (currentRange === "yesterday") {
    var y = new Date(today); y.setDate(today.getDate() - 1);
    push(fmtDateLocal(y), "昨");
    caption = "昨日 API Token 使用量";
  } else if (currentRange === "30d") {
    var s30 = new Date(today); s30.setDate(today.getDate() - 29);
    while (s30 <= today) { push(fmtDateLocal(s30), fmtDay(s30)); s30.setDate(s30.getDate() + 1); }
    caption = "过去 30 日 API Token 使用量";
  } else if (currentRange === "month") {
    var f = new Date(today.getFullYear(), today.getMonth(), 1);
    while (f <= today) { push(fmtDateLocal(f), fmtDay(f)); f.setDate(f.getDate() + 1); }
    caption = "本月 API Token 使用量";
  } else if (currentRange === "lastMonth") {
    var f2 = new Date(today.getFullYear(), today.getMonth() - 1, 1);
    var l2 = new Date(today.getFullYear(), today.getMonth(), 0);
    while (f2 <= l2) { push(fmtDateLocal(f2), fmtDay(f2)); f2.setDate(f2.getDate() + 1); }
    caption = "上月 API Token 使用量";
  } else if (currentRange === "custom") {
    if (customFrom && customTo) {
      var a = parseDate(customFrom), b = parseDate(customTo);
      if (a <= b) { while (a <= b) { push(fmtDateLocal(a), fmtDay(a)); a.setDate(a.getDate() + 1); } }
      caption = "自定义时段 API Token 使用量";
    }
  } else { // 7d 默认
    for (var i = 6; i >= 0; i--) {
      var d = new Date(today); d.setDate(today.getDate() - i);
      push(fmtDateLocal(d), fmtDay(d));
    }
    caption = "过去 7 日 API Token 使用量";
  }
  setText("chartCaption", caption);

  var n = items.length;
  var max = 1;
  items.forEach(function (it) { if (it.tokens > max) max = it.tokens; });

  // 纵轴
  var y = document.getElementById("yAxis");
  y.innerHTML = "<span>" + fmtTokens(max) + "</span>" +
    "<span>" + fmtTokens(Math.round(max / 2)) + "</span>" +
    "<span>0</span>";

  var bars = document.getElementById("bars");
  bars.style.gridTemplateColumns = "repeat(" + n + ", 1fr)";
  bars.innerHTML = "";
  // ≤15 天保留柱顶数值；>15 天压缩柱宽、隐藏数值、抽稀并缩短标签，观察趋势
  var showValue = n <= 15;
  var shortLabel = n > 15;
  var labelStep = n > 15 ? Math.ceil(n / 10) : 1;
  items.forEach(function (it, i) {
    var wrap = document.createElement("div");
    wrap.className = "bar-wrap";
    if (showValue) {
      var val = document.createElement("div");
      val.className = "bar-value";
      val.textContent = fmtTokens(it.tokens);
      wrap.appendChild(val);
    }
    var bar = document.createElement("div");
    bar.className = "bar" + (it.current ? " current" : "");
    bar.style.height = Math.max(2, it.tokens / max * 100) + "%";
    if (n > 15) bar.style.width = "55%"; // 压缩柱宽，突出趋势
    if (i % labelStep === 0) {
      var lbl = document.createElement("div");
      lbl.className = "bar-label" + (it.current ? " current" : "");
      // 大量柱时用短格式（"06-15" → "15"），减小标签宽度避免与柱子重叠
      lbl.textContent = shortLabel ? shortDay(it.label) : it.label;
      wrap.appendChild(lbl);
    }
    wrap.appendChild(bar);
    bars.appendChild(wrap);
  });
}

function fmtDateLocal(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function fmtDay(d) {
  var t = new Date(); t.setHours(0,0,0,0);
  var y = new Date(t); y.setDate(t.getDate() - 1);
  var ds = fmtDateLocal(d);
  if (ds === fmtDateLocal(t)) return "今";
  if (ds === fmtDateLocal(y)) return "昨";
  return String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

// 趋势 SVG 箭头（三角 + 柄），比文本 ↑/↓ 更明显、贴合深色主题
function trendSvg(dir) {
  var body;
  if (dir === "↑") {
    body = '<path d="M6 1 L10 5.6 L6 4.2 L2 5.6 Z" fill="currentColor"/>' +
           '<line x1="6" y1="4.2" x2="6" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>';
  } else if (dir === "↓") {
    body = '<path d="M6 9 L10 4.4 L6 5.8 L2 4.4 Z" fill="currentColor"/>' +
           '<line x1="6" y1="5.8" x2="6" y2="0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>';
  } else {
    body = '<line x1="2" y1="5" x2="10" y2="5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>';
  }
  return '<svg width="12" height="11" viewBox="0 0 12 11" style="display:inline-block;vertical-align:-1px;margin-right:3px">' + body + '</svg>';
}

// 短格式："06-15" → "15"；"今"/"昨" 原样返回（用于大量柱时横轴标签）
function shortDay(label) {
  var p = label.split("-");
  return p.length === 2 ? p[1] : label;
}

// 直调渲染函数（备用通道，绕过 postMessage 监听）
window.__renderBalance = function (msg) {
  try { render(msg); } catch (e) {}
};

// 全部内容放大预览（固定 1.35，不做超高适配，便于查看放大效果）
function fitViewport() {
  document.body.style.zoom = "1.35";
}
window.addEventListener("resize", fitViewport);
window.addEventListener("load", fitViewport);
fitViewport();

// 监听 postMessage
if (bridge) {
  bridge.addEventListener("message", function (e) {
    try { render(JSON.parse(e.data)); } catch (e) {}
  });
  bridge.postMessage({ type: "ready" });
}

// 自适应：宿主主题注入 CSS 变量
function applyTheme(t) {
  if (!t) return;
  var r = document.documentElement.style;
  r.setProperty("--text", t.text || "#ebe9e1");
  r.setProperty("--muted", t.weak || "#918f86");
  r.setProperty("--green", t.accent || "#78d47d");
  r.setProperty("--bg", t.paper || "#181815");
}
</script>
</body>
</html>
