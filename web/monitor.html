<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>API 余额监测</title>
<script>
/* ── Accordion 折叠:首次 paint 前同步读取 localStorage,避免闪烁 ── */
(function () {
  try {
    var raw = localStorage.getItem("paperTodo.balanceMonitor.collapse");
    if (!raw) return;
    var s = JSON.parse(raw);
    var root = document.documentElement;
    if (s.metrics === true) root.setAttribute("data-init-open", "metrics");
    if (s.chart === true)   root.setAttribute("data-init-open", "chart");
  } catch (e) {}
})();
</script>
<style>
:root{
  --bg:#11110f;--s:#181815;--line:#30302a;
  --text:#ebe9e1;--muted:#918f86;--dim:#65645d;
  --green:#78d47d;--warn:#e6c66a;--danger:#e28787;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua","Noto Serif SC","Songti SC","STSong",serif;
  --sans:Inter,"Segoe UI","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;overflow-y:auto}
.panel{width:100%;min-height:100vh;background:var(--s);border:0;border-radius:0 0 18px 18px;overflow:hidden}
main{padding:12px 14px 10px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.balance-block{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:flex-start;gap:clamp(10px,2vw,16px)}
.label{color:var(--muted);font:11px var(--serif);margin-bottom:5px}
.balance{display:flex;align-items:baseline;gap:5px}
.symbol{font:18px var(--serif);color:#c8c6bd}
.number{font:500 30px/1 var(--serif);letter-spacing:-1px}
.currency{color:var(--muted);font:11px var(--serif);margin-left:2px}
.updated{margin-top:5px;color:var(--dim);font-size:9px}
.status{text-align:right;padding-top:4px}
.status-main{display:flex;align-items:center;justify-content:flex-end;gap:6px;color:var(--green);font:600 12px var(--serif)}
.status-main.err{color:var(--danger)}
.status-main.warn{color:var(--warn)}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.status-dot.err{background:var(--danger)}
.status-dot.warn{background:var(--warn)}
.status-sub{margin-top:4px;color:var(--dim);font-size:9px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:10px}
.metric{padding:0 8px;border-left:1px solid var(--line)}
.metric:first-child{border-left:0;padding-left:0}
.metric:last-child{padding-right:0}
.metric-label{color:var(--muted);font:12px var(--serif);margin-bottom:5px}
.metric-value{font:500 18px var(--serif);white-space:nowrap}
.tokens-suffix{font:500 10px var(--serif);color:var(--muted);margin-left:2px}
.metric-foot{margin-top:3px;color:var(--dim);font-family:var(--serif);font-size:10px;line-height:1.35}
.metric-foot + .metric-foot{margin-top:1px}
.metric-models{margin-top:2px;display:flex;flex-direction:column;gap:1px;font-family:var(--serif);font-size:9px;color:var(--muted)}
.metric-model-row{display:flex;justify-content:space-between;gap:8px}
.metric-model-row .m-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric-model-row .m-val{color:var(--text);font-variant-numeric:tabular-nums}
.chart-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:6px}
.chart-title{font:600 13px var(--serif)}
.chart-caption{color:var(--dim);font:9px var(--serif);margin-top:2px}
.select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:#1c1c19 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='8' viewBox='0 0 8 8'><path d='M1 2.5 L4 5.5 L7 2.5' stroke='%23918f86' stroke-width='1.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 7px center;color:var(--muted);padding:4px 22px 4px 10px;border-radius:7px;font:10px var(--serif);outline:none;cursor:pointer;color-scheme:dark;transition:border-color .15s ease,color .15s ease,background-color .15s ease}
.select:hover{color:var(--text);border-color:#4e4e45;background-color:#232320}
.select:focus{color:var(--text);border-color:var(--green)}
/* 右上角供应商切换 ⚙ 按钮 + 下拉菜单 */
.settings-gear{position:relative;margin-left:10px;align-self:flex-start;flex-shrink:0}
.gear-btn{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);width:26px;height:26px;border-radius:7px;font-size:14px;line-height:1;cursor:pointer;transition:color .15s,border-color .15s,background-color .15s}
.gear-btn:hover{color:var(--text);border-color:#4e4e45;background-color:#232320}
.gear-btn.open{border-color:var(--green);color:var(--text)}
.gear-menu{position:absolute;top:calc(100% + 6px);right:0;min-width:156px;background:#1c1c19;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.4);padding:5px;z-index:60}
.gear-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:0;color:var(--muted);padding:7px 10px;border-radius:6px;font:600 12px/1 var(--serif);cursor:pointer;transition:background-color .12s,color .12s}
.gear-item:hover{background:rgba(255,255,255,.06);color:var(--text)}
.gear-item.active{color:var(--text)}
.gear-dot{width:6px;height:6px;border-radius:50%;border:1px solid var(--muted);flex-shrink:0}
.gear-item.active .gear-dot{background:var(--green);border-color:var(--green)}
.custom-range{display:flex;align-items:center;gap:6px;margin-bottom:6px;font:10px var(--serif);color:var(--dim)}
.custom-range input{background:#11110f;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:10px var(--serif);color-scheme:dark}
.chart{height:105px;position:relative;border-bottom:1px solid var(--line);padding:12px 6px 18px 30px;background:
  linear-gradient(to bottom, transparent 48.15%, rgba(255,255,255,.04) 48.35%, transparent 48.55%),
  transparent}
.chart::before{content:"";position:absolute;left:30px;top:12px;bottom:18px;width:1px;background:var(--line);opacity:.55}
.y-axis{position:absolute;left:0;top:10px;bottom:20px;display:flex;flex-direction:column;justify-content:space-between;color:var(--dim);font:9px var(--serif);width:26px}
.y-axis span{display:block;text-align:right;padding-right:6px}
.bars{height:100%;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.bar-wrap{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.bar-value{margin-bottom:3px;color:#aaa89f;font:9px var(--serif)}
.bar{width:18px;max-width:75%;min-height:2px;border-radius:2px 2px 0 0;background:#4e824f}
.bar.current{background:var(--green)}
.bar-label{position:absolute;bottom:-18px;color:var(--dim);font:8px var(--serif);background:var(--s);padding:1px 4px;border-radius:2px;white-space:nowrap;line-height:1.2;z-index:2}
.bar-label.current{color:var(--text)}
.bottom{display:flex;justify-content:space-between;margin-top:8px;color:var(--dim);font:8px var(--serif)}
.hooks{margin-top:12px;padding:10px 14px 12px;border:1px solid var(--line);border-radius:8px;background:var(--s)}
.hooks-title{font:600 11px/1 var(--serif);color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:5px}
.hooks-title::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);animation:hook-pulse 2s ease-in-out infinite}
@keyframes hook-pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hooks-list{list-style:none;padding:0;margin:0;font:10px/1.5 var(--serif);color:var(--dim)}
.hooks-list li{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed var(--line)}
.hooks-list li:last-child{border-bottom:0}
.hooks-list .h-time{color:var(--dim);font-variant-numeric:tabular-nums;flex-shrink:0}
.hooks-list .h-text{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
@media(max-width:520px){
  main{padding:21px 18px 17px}
  .top{display:block}
  .status{text-align:left;margin-top:14px}
  .status-main{justify-content:flex-start}
  .number{font-size:47px}
  .metrics{grid-template-columns:1fr;gap:14px}
  .metric{border-left:0!important;padding:0!important}
  .metric-foot{display:none}
}
/* ── 可折叠面板 ── */
.collapsible{margin-bottom:10px}
.collapsible:last-child{margin-bottom:0}
.coll-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;background:transparent;border:0;color:var(--muted);
  padding:5px 4px;cursor:pointer;border-radius:6px;
  font:600 11px/1 var(--serif);text-align:left;
  transition:color .15s,background-color .15s;
}
.coll-head:hover{color:var(--text);background:rgba(255,255,255,.04)}
.coll-head:focus-visible{outline:1px solid var(--green);outline-offset:2px}
.coll-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coll-head-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
/* CSS chevron:复用 .select 下拉箭头风格,旋转表达开合 */
.coll-icon{
  width:10px;height:10px;flex-shrink:0;
  border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;
  transform:rotate(-45deg);transition:transform .18s ease;color:var(--muted)
}
.collapsible.is-open .coll-icon{transform:rotate(45deg)}
.collapsible.is-open .coll-head{color:var(--text)}
/* 默认折叠;.is-open 覆盖 */
.collapsible>.coll-body{display:none}
.collapsible.is-open>.coll-body{display:block}
.collapsible:not(.is-open) .coll-icon{color:var(--dim)}
/* head 脚本同步覆盖(首次 paint 应用持久化状态,避免闪烁) */
html[data-init-open="metrics"] .collapsible[data-collapsible="metrics"]>.coll-body{display:block}
html[data-init-open="metrics"] .collapsible[data-collapsible="metrics"] .coll-icon{transform:rotate(45deg)}
html[data-init-open="chart"] .collapsible[data-collapsible="chart"]>.coll-body{display:block}
html[data-init-open="chart"] .collapsible[data-collapsible="chart"] .coll-icon{transform:rotate(45deg)}
</style>
</head>
<body>
<section class="panel">
<main>
  <!-- 余额 + 状态（圆环组件已删除） -->
  <section class="top">
    <div class="balance-block">
      <div>
        <div class="label">可用余额</div>
        <div class="balance">
          <span class="symbol" id="symbol">¥</span>
          <span class="number" id="number">—</span>
          <span class="currency" id="currency"></span>
        </div>
        <div class="updated" id="updated">最后检测 · —</div>
      </div>
      <div class="status">
        <div class="status-main" id="statusMain"><i class="status-dot" id="statusDot"></i><span id="statusText">等待数据…</span></div>
        <div class="status-sub" id="statusSub">—</div>
      </div>
    </div>
    <!-- 右上角供应商切换：点击 ⚙ 展开列表 -->
    <div class="settings-gear" id="settingsGear">
      <button type="button" class="gear-btn" id="gearBtn" title="切换供应商">⚙</button>
      <div class="gear-menu" id="gearMenu" hidden>
        <button type="button" class="gear-item" data-provider="deepseek"><span class="gear-dot"></span>DeepSeek</button>
        <button type="button" class="gear-item" data-provider="minimax"><span class="gear-dot"></span>MiniMax</button>
        <button type="button" class="gear-item" data-provider="zhipu"><span class="gear-dot"></span>ZhiPu GLM</button>
        <button type="button" class="gear-item" data-provider="kimi"><span class="gear-dot"></span>Kimi For Coding</button>
        <button type="button" class="gear-item" data-provider="opencode"><span class="gear-dot"></span>OpenCode Go</button>
      </div>
    </div>
  </section>


  <!-- 三指标卡(可折叠,默认收起) -->
  <div class="collapsible" id="collMetrics" data-collapsible="metrics">
    <button type="button" class="coll-head" aria-expanded="false" aria-controls="collMetricsBody">
      <span class="coll-title">今日消费 / 近 7 日 / 今日消耗</span>
      <span class="coll-icon" aria-hidden="true"></span>
    </button>
    <div class="coll-body" id="collMetricsBody">
      <section class="metrics">
        <div class="metric">
          <div class="metric-label">今日消费金额</div>
          <div class="metric-value" id="costToday" style="color:#fff">—</div>
          <div class="metric-foot" id="costTodayFoot" style="color:var(--dim)"></div>
          <div class="metric-models" id="costTodayModels"></div>
        </div>
        <div class="metric">
          <div class="metric-label">近 7 日</div>
          <div class="metric-value" id="cost7d">—</div>
          <div class="metric-foot" id="cost7dFoot">—</div>
        </div>
        <div class="metric">
          <div class="metric-label">今日消耗</div>
          <div class="metric-value"><span id="todayTokens">—</span><span class="tokens-suffix"> Tokens</span></div>
          <div class="metric-foot" id="todayTokensFoot"></div>
          <div class="metric-foot" id="todayHitFoot"></div>
          <div class="metric-foot" id="todayRateFoot"></div>
        </div>
      </section>
    </div>
  </div>

  <!-- 用量趋势：7 根柱 + 纵轴(可折叠,默认收起;header 保留 select 切换时段) -->
  <div class="collapsible" id="collChart" data-collapsible="chart">
    <div class="coll-head" role="button" tabindex="0" aria-expanded="false" aria-controls="collChartBody">
      <div class="chart-head">
        <div>
          <div class="chart-title">用量趋势</div>
          <div class="chart-caption" id="chartCaption">过去 7 日 API Token 使用量</div>
        </div>
        <div class="coll-head-right">
          <select class="select" id="rangeSelect">
            <option value="today">今天</option>
            <option value="yesterday">昨天</option>
            <option value="7d" selected>近 7 天</option>
            <option value="30d">近 30 天</option>
            <option value="month">本月</option>
            <option value="lastMonth">上月</option>
            <option value="custom">自定义</option>
          </select>
          <span class="coll-icon" aria-hidden="true"></span>
        </div>
      </div>
    </div>
    <div class="coll-body" id="collChartBody">
      <div class="custom-range" id="customRange" style="display:none">
        <input type="date" id="fromDate">
        <span>至</span>
        <input type="date" id="toDate">
      </div>
      <div class="chart">
        <div class="y-axis" id="yAxis"><span>—</span><span>—</span><span>0</span></div>
        <div class="bars" id="bars"></div>
      </div>
      <footer class="bottom">
        <span>API Usage Monitor</span>
        <span id="updateTime">—</span>
      </footer>
    </div>
  </div>

  <!-- Claude Code Hook 活动流：最近 5 条 hook 事件 -->
  <section class="hooks" id="hooksSection" hidden>
    <div class="hooks-title">Claude 活动</div>
    <ul class="hooks-list" id="hooksList"></ul>
  </section>
</main>
</section>
<script>
"use strict";

// ── 数据桥：宿主通过 window.chrome.webview.postMessage 推送 {theme, data} ──
// 页面自身不发任何网络请求（CORS 限制），数据全部来自 C# 拉取并推送。
var bridge = window.chrome && window.chrome.webview;
var currentUsage = [];
var currentRange = "7d";
var customFrom = "";
var customTo = "";

function fmtTokens(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
  return "" + n;
}

// 千分位："1234567" → "1,234,567"
function fmtThousands(n) {
  return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

// 万/亿简写："12345" → "1.2万"；"345000000" → "3.4亿"
function fmtWanYi(n) {
  if (n >= 1e8) return (n / 1e8).toFixed(1) + "亿";
  if (n >= 1e4) return (n / 1e4).toFixed(1) + "万";
  return "" + n;
}

function setText(id, t) { var el = document.getElementById(id); if (el) el.textContent = t; }

// Claude Code hook 活动流：按数组顺序渲染最近 5 条；空数组隐藏整个 section。
function renderHooks(hooks) {
  var section = document.getElementById("hooksSection");
  var list = document.getElementById("hooksList");
  if (!section || !list) return;
  if (!hooks || hooks.length === 0) { section.hidden = true; list.innerHTML = ""; return; }
  section.hidden = false;
  var html = "";
  for (var i = 0; i < hooks.length; i++) {
    var h = hooks[i];
    var txt = (h.summary || h.event || "").toString();
    html += '<li><span class="h-time">' + escapeHtml(h.time || "") +
            '</span><span class="h-text" title="' + escapeHtml(txt) + '">' +
            escapeHtml(txt) + '</span></li>';
  }
  list.innerHTML = html;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" })[c];
  });
}

function render(msg) {
  if (!msg) return;
  applyTheme(msg.theme);
  var d = msg.data || {};
  // 供应商高亮：当前 provider 在下拉列表里打勾
  var provider = d.provider || "deepseek";
  var menu = document.getElementById("gearMenu");
  if (menu) {
    var items = menu.querySelectorAll(".gear-item");
    items.forEach(function (b) {
      var isActive = b.getAttribute("data-provider") === provider;
      if (isActive) b.classList.add("active");
      else b.classList.remove("active");
    });
  }

  // 顶部：余额
  var sym = d.currencySymbol || "";
  var amt = d.hasBalance ? d.balance : "—";
  setText("symbol", sym);
  setText("number", amt);
  setText("currency", d.currency || "");
  setText("updated", "最后检测 · " + (d.updateTime || "—"));

  // 状态点 + 文字
  var main = document.getElementById("statusMain");
  var dot = document.getElementById("statusDot");
  main.classList.remove("err", "warn");
  dot.classList.remove("err", "warn");
  if (d.statusKind === "ok") {
    setText("statusText", "在线");
    setText("statusSub", "当前状态正常");
  } else if (d.statusKind === "error") {
    main.classList.add("err"); dot.classList.add("err");
    setText("statusText", d.status || "错误");
    setText("statusSub", "请求异常");
  } else {
    main.classList.add("warn"); dot.classList.add("warn");
    setText("statusText", d.status || "未配置");
    setText("statusSub", "请在设置页填写");
  }

  // 三指标卡
  setText("costToday", d.costToday || "—");
  var tFoot = document.getElementById("costTodayFoot");
  if (d.costTodayFoot) {
    tFoot.style.display = "";
    tFoot.innerHTML = "";
    // "相较昨日" 用正常弱色，箭头单独用 SVG（更明显），颜色按趋势
    var m = String(d.costTodayFoot).match(/^(相较昨日 )([↑↓→])(.*)$/);
    if (m) {
      var lbl = document.createElement("span");
      lbl.style.color = "var(--dim)";
      lbl.textContent = m[1];
      var arrow = document.createElement("span");
      arrow.style.color = m[2] === "↑" ? "var(--danger)" : (m[2] === "↓" ? "var(--green)" : "var(--dim)");
      arrow.innerHTML = trendSvg(m[2]) + m[3];
      tFoot.appendChild(lbl);
      tFoot.appendChild(arrow);
    } else {
      tFoot.textContent = d.costTodayFoot;
    }
  } else { tFoot.style.display = "none"; }
  // 各模型消费明细（≥2 个模型才展示）
  var mBox = document.getElementById("costTodayModels");
  mBox.innerHTML = "";
  if (d.costTodayModels && d.costTodayModels.length >= 2) {
    mBox.style.display = "";
    d.costTodayModels.forEach(function (m) {
      var row = document.createElement("div");
      row.className = "metric-model-row";
      var name = document.createElement("span");
      name.className = "m-name";
      name.textContent = m.model;
      var val = document.createElement("span");
      val.className = "m-val";
      val.textContent = m.costText;
      row.appendChild(name);
      row.appendChild(val);
      mBox.appendChild(row);
    });
  } else { mBox.style.display = "none"; }
  setText("cost7d", d.cost7d || "—");
  var f7 = document.getElementById("cost7dFoot");
  if (d.cost7dFoot) { f7.textContent = d.cost7dFoot; f7.style.display = ""; }
  else { f7.style.display = "none"; }
  // 今日消耗（Token 单位）
  var hasTokens = d.todayTokens > 0;
  setText("todayTokens", hasTokens ? fmtThousands(d.todayTokens) : "—");
  var tSuffix = document.querySelector(".tokens-suffix");
  if (tSuffix) tSuffix.style.display = hasTokens ? "" : "none";
  var ttFoot = document.getElementById("todayTokensFoot");
  if (hasTokens) { ttFoot.textContent = "≈ " + fmtWanYi(d.todayTokens); ttFoot.style.display = ""; }
  else { ttFoot.style.display = "none"; }
  var thFoot = document.getElementById("todayHitFoot");
  if (hasTokens) {
    thFoot.textContent = "缓存命中: " + fmtThousands(d.todayHit || 0) + " Tokens";
    thFoot.style.display = "";
  } else { thFoot.style.display = "none"; }
  var trFoot = document.getElementById("todayRateFoot");
  if (hasTokens && d.cacheRate != null) {
    trFoot.textContent = "缓存命中率 " + (d.cacheRate * 100).toFixed(2) + "%";
    trFoot.style.display = "";
  } else { trFoot.style.display = "none"; }

  // 用量柱状图
  currentUsage = d.usage || [];
  renderChart();
  setText("updateTime", d.updateTime || "—");
  renderHooks(d.hooks || []);
}

// 选定时段重新过滤渲染（不重新请求 C#）
function bindRange() {
  var sel = document.getElementById("rangeSelect");
  if (!sel) return;
  // 同步 DOM 当前选中值到 currentRange（首次加载）
  currentRange = sel.value;
  function sync() {
    currentRange = sel.value;
    var cr = document.getElementById("customRange");
    if (cr) cr.style.display = (currentRange === "custom") ? "flex" : "none";
    renderChart();
  }
  // 多事件触发，确保 WebView2 / 其它环境都能响应
  sel.addEventListener("change", sync);
  sel.addEventListener("input", sync);
  sel.addEventListener("click", sync);
  // 自定义日期
  document.getElementById("fromDate").addEventListener("change", function () { customFrom = this.value; renderChart(); });
  document.getElementById("toDate").addEventListener("change", function () { customTo = this.value; renderChart(); });
}
// script 位于 body 末尾，DOM 已就绪，只绑定一次。
bindRange();

/* ── Accordion 折叠:localStorage 持久化 + 无闪烁恢复 ── */
var COLLAPSE_KEY = "paperTodo.balanceMonitor.collapse";
var DEFAULT_COLLAPSE = { metrics: true,  chart: true  }; // true=默认展开(笔记纸默认尺寸适配)

function loadCollapseState() {
  try {
    var raw = localStorage.getItem(COLLAPSE_KEY);
    if (!raw) return Object.assign({}, DEFAULT_COLLAPSE);
    return Object.assign({}, DEFAULT_COLLAPSE, JSON.parse(raw));
  } catch (e) {
    return Object.assign({}, DEFAULT_COLLAPSE);
  }
}
function saveCollapseState(state) {
  try { localStorage.setItem(COLLAPSE_KEY, JSON.stringify(state)); } catch (e) {}
}

function initCollapsibles() {
  var state = loadCollapseState();
  // 一次性迁移:zoom 1.0× 适配后默认改为展开,清掉旧的折叠状态
  try {
    if (!localStorage.getItem("paperTodo.balanceMonitor.collapse.v2")) {
      localStorage.removeItem("paperTodo.balanceMonitor.collapse");
      localStorage.setItem("paperTodo.balanceMonitor.collapse.v2", "1");
      state = Object.assign({}, DEFAULT_COLLAPSE);
      saveCollapseState(state);
    }
  } catch (e) {}
  var nodes = document.querySelectorAll(".collapsible[data-collapsible]");
  // 清除 head 脚本注入的临时属性,避免重复控制
  document.documentElement.removeAttribute("data-init-open");
  nodes.forEach(function (el) {
    var key = el.getAttribute("data-collapsible");
    var head = el.querySelector(".coll-head");
    if (!head || !DEFAULT_COLLAPSE.hasOwnProperty(key)) return;
    // 同步 class 与 aria-expanded(首次 paint 已被 head 脚本 + CSS 控制,这里只补 class)
    var open = state[key] === true;
    el.classList.toggle("is-open", open);
    head.setAttribute("aria-expanded", open ? "true" : "false");
    head.addEventListener("click", function (ev) {
      // header 内若有交互控件(<select>、<input>),点击控件时不触发折叠
      if (ev.target.closest("select, input")) return;
      var nowOpen = el.classList.toggle("is-open");
      head.setAttribute("aria-expanded", nowOpen ? "true" : "false");
      state[key] = nowOpen;
      saveCollapseState(state);
    });
  });
}

initCollapsibles();

function parseDate(s) {
  var p = s.split("-");
  return new Date(+p[0], +p[1] - 1, +p[2]);
}

function renderChart() {
  var byDate = {};
  currentUsage.forEach(function (u) { byDate[u.date] = u.tokens; });
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var todayStr = fmtDateLocal(today);
  var items = [];
  function push(d, label) {
    items.push({ date: d, tokens: byDate[d] || 0, label: label, current: (d === todayStr) });
  }
  var caption = "";
  if (currentRange === "today") {
    push(todayStr, "今");
    caption = "今日 API Token 使用量";
  } else if (currentRange === "yesterday") {
    var y = new Date(today); y.setDate(today.getDate() - 1);
    push(fmtDateLocal(y), "昨");
    caption = "昨日 API Token 使用量";
  } else if (currentRange === "30d") {
    var s30 = new Date(today); s30.setDate(today.getDate() - 29);
    while (s30 <= today) { push(fmtDateLocal(s30), fmtDay(s30)); s30.setDate(s30.getDate() + 1); }
    caption = "过去 30 日 API Token 使用量";
  } else if (currentRange === "month") {
    var f = new Date(today.getFullYear(), today.getMonth(), 1);
    while (f <= today) { push(fmtDateLocal(f), fmtDay(f)); f.setDate(f.getDate() + 1); }
    caption = "本月 API Token 使用量";
  } else if (currentRange === "lastMonth") {
    var f2 = new Date(today.getFullYear(), today.getMonth() - 1, 1);
    var l2 = new Date(today.getFullYear(), today.getMonth(), 0);
    while (f2 <= l2) { push(fmtDateLocal(f2), fmtDay(f2)); f2.setDate(f2.getDate() + 1); }
    caption = "上月 API Token 使用量";
  } else if (currentRange === "custom") {
    if (customFrom && customTo) {
      var a = parseDate(customFrom), b = parseDate(customTo);
      if (a <= b) { while (a <= b) { push(fmtDateLocal(a), fmtDay(a)); a.setDate(a.getDate() + 1); } }
      caption = "自定义时段 API Token 使用量";
    }
  } else { // 7d 默认
    for (var i = 6; i >= 0; i--) {
      var d = new Date(today); d.setDate(today.getDate() - i);
      push(fmtDateLocal(d), fmtDay(d));
    }
    caption = "过去 7 日 API Token 使用量";
  }
  setText("chartCaption", caption);

  var n = items.length;
  var max = 1;
  items.forEach(function (it) { if (it.tokens > max) max = it.tokens; });

  // 纵轴
  var y = document.getElementById("yAxis");
  y.innerHTML = "<span>" + fmtTokens(max) + "</span>" +
    "<span>" + fmtTokens(Math.round(max / 2)) + "</span>" +
    "<span>0</span>";

  var bars = document.getElementById("bars");
  bars.style.gridTemplateColumns = "repeat(" + n + ", 1fr)";
  bars.innerHTML = "";
  // ≤15 天保留柱顶数值；>15 天压缩柱宽、隐藏数值、抽稀并缩短标签，观察趋势
  var showValue = n <= 15;
  var shortLabel = n > 15;
  var labelStep = n > 15 ? Math.ceil(n / 10) : 1;
  items.forEach(function (it, i) {
    var wrap = document.createElement("div");
    wrap.className = "bar-wrap";
    if (showValue) {
      var val = document.createElement("div");
      val.className = "bar-value";
      val.textContent = fmtTokens(it.tokens);
      wrap.appendChild(val);
    }
    var bar = document.createElement("div");
    bar.className = "bar" + (it.current ? " current" : "");
    bar.style.height = Math.max(2, it.tokens / max * 100) + "%";
    if (n > 15) bar.style.width = "55%"; // 压缩柱宽，突出趋势
    if (i % labelStep === 0) {
      var lbl = document.createElement("div");
      lbl.className = "bar-label" + (it.current ? " current" : "");
      // 大量柱时用短格式（"06-15" → "15"），减小标签宽度避免与柱子重叠
      lbl.textContent = shortLabel ? shortDay(it.label) : it.label;
      wrap.appendChild(lbl);
    }
    wrap.appendChild(bar);
    bars.appendChild(wrap);
  });
}

function fmtDateLocal(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function fmtDay(d) {
  var t = new Date(); t.setHours(0,0,0,0);
  var y = new Date(t); y.setDate(t.getDate() - 1);
  var ds = fmtDateLocal(d);
  if (ds === fmtDateLocal(t)) return "今";
  if (ds === fmtDateLocal(y)) return "昨";
  return String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

// 趋势箭头 SVG：三角+柄,贴合深色主题
function trendSvg(dir) {
  var body;
  if (dir === "↑") {
    body = '<path d="M6 1 L10 5.6 L6 4.2 L2 5.6 Z" fill="currentColor"/>' +
           '<line x1="6" y1="4.2" x2="6" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>';
  } else if (dir === "↓") {
    body = '<path d="M6 9 L10 4.4 L6 5.8 L2 4.4 Z" fill="currentColor"/>' +
           '<line x1="6" y1="5.8" x2="6" y2="0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>';
  } else {
    body = '<line x1="2" y1="5" x2="10" y2="5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>';
  }
  return '<svg width="12" height="11" viewBox="0 0 12 11" style="display:inline-block;vertical-align:-1px;margin-right:3px">' + body + '</svg>';
}

// 短格式："06-15" → "15"；"今"/"昨" 原样返回（用于大量柱时横轴标签）
function shortDay(label) {
  var p = label.split("-");
  return p.length === 2 ? p[1] : label;
}

// 直调渲染函数（备用通道，绕过 postMessage 监听）
window.__renderBalance = function (msg) {
  try { render(msg); } catch (e) {}
};

// 页面等比缩放：跟随宿主 WebView 容器尺寸变化
// 宿主笔记纸默认宽度 304 DIP(320 - 16 chrome 边距),
// baseVisualZoom = 304 DIP 下视觉缩放,等价于旧版的固定 1.35。
// Todo 纸 264 DIP / 大尺寸 paper 等场景下,按 innerWidth / 304 等比缩放。
(function () {
  var BASE_DIP = 304;
  var BASE_VISUAL_ZOOM = 1.0;   // 笔记纸 304 DIP 下视觉缩放 1.0×(适配后)
  var ZOOM_MIN = 0.85;
  var ZOOM_MAX = 1.5;
  function syncZoom() {
    var ratio = Math.max(0.01, window.innerWidth) / BASE_DIP;
    var zoom = ratio * BASE_VISUAL_ZOOM;
    document.body.style.zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoom)).toFixed(3);
  }
  window.addEventListener("resize", syncZoom);
  if (window.ResizeObserver) {
    new ResizeObserver(syncZoom).observe(document.documentElement);
  }
  // DOMContentLoaded 阶段立即应用,避免首次 paint 是未缩放状态
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", syncZoom, { once: true });
  } else {
    syncZoom();
  }
})();

// 监听 postMessage
if (bridge) {
  bridge.addEventListener("message", function (e) {
    try { render(JSON.parse(e.data)); } catch (e) {}
  });
  bridge.postMessage({ type: "ready" });
}

// 右上角 ⚙ 供应商切换：点按钮展开/收起列表；点列表项切换；点外部收起
(function () {
  var gear = document.getElementById("settingsGear");
  var btn = document.getElementById("gearBtn");
  var menu = document.getElementById("gearMenu");
  if (!gear || !btn || !menu) return;

  function setOpen(open) {
    menu.hidden = !open;
    btn.classList.toggle("open", open);
  }
  btn.addEventListener("click", function (ev) {
    ev.stopPropagation();
    setOpen(menu.hidden);
  });
  menu.addEventListener("click", function (ev) {
    var t = ev.target;
    if (!t || !t.classList || !t.classList.contains("gear-item")) return;
    var p = t.getAttribute("data-provider");
    if (!p) return;
    setOpen(false);
    if (t.classList.contains("active")) return; // 已是当前
    if (bridge) {
      bridge.postMessage({ type: "switchProvider", provider: p });
    }
  });
  document.addEventListener("click", function () { setOpen(false); });
})();

// 自适应：宿主主题注入 CSS 变量
function applyTheme(t) {
  if (!t) return;
  var r = document.documentElement.style;
  r.setProperty("--text", t.text || "#ebe9e1");
  r.setProperty("--muted", t.weak || "#918f86");
  r.setProperty("--green", t.accent || "#78d47d");
  r.setProperty("--bg", t.paper || "#181815");
}
