<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token Plan — Monitor</title>
<style>
:root{
  --paper:#f3efe7; --paper-deep:#e9e3d7;
  --ink:#24211d; --muted:#81796e;
  --line:#cfc7ba; --soft-line:#ddd6ca;
  --accent:#9b493d; --accent-soft:#ead8d3;
  --ok:#526b58; --bg:#d9d3c8;
}
[data-dark]{
  --paper:#181815; --paper-deep:#1f1f1b;
  --ink:#ebe9e1; --muted:#918f86;
  --line:#30302a; --soft-line:#3a3a33;
  --accent:#e28787; --accent-soft:#3a2626;
  --ok:#78d47d; --bg:#11110f;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:transparent;color:var(--ink);font-family:"Noto Serif SC","Source Han Serif SC","Songti SC",Georgia,serif}
.page{width:100%;min-height:100vh;background:transparent;padding:clamp(22px,4vw,42px) clamp(18px,4vw,40px)}
.header{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;padding-bottom:clamp(18px,3vw,28px);border-bottom:1px solid var(--ink)}
/* 右上角供应商切换 ⚙ 按钮 + 下拉菜单 */
.settings-gear{position:relative;align-self:flex-start;flex-shrink:0}
.gear-btn{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);width:26px;height:26px;border-radius:7px;font-size:14px;line-height:1;cursor:pointer;transition:color .15s,border-color .15s,background-color .15s;font-family:"Noto Serif SC","Source Han Serif SC","Songti SC",Georgia,serif}
.gear-btn:hover{color:var(--ink);border-color:var(--muted)}
.gear-btn.open{border-color:var(--accent);color:var(--ink)}
.gear-menu{position:absolute;top:calc(100% + 6px);right:0;min-width:156px;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(35,29,20,.18);padding:5px;z-index:60}
.gear-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:0;color:var(--muted);padding:7px 10px;border-radius:6px;font:600 12px/1 var(--serif);cursor:pointer;transition:background-color .12s,color .12s}
.gear-item:hover{background:var(--accent-soft);color:var(--ink)}
.gear-item.active{color:var(--ink)}
.gear-dot{width:6px;height:6px;border-radius:50%;border:1px solid var(--muted);flex-shrink:0}
.gear-item.active .gear-dot{background:var(--accent);border-color:var(--accent)}
h1{margin:0;font-size:clamp(26px,4vw,44px);line-height:1.1;font-weight:600;letter-spacing:-1px}
.header-meta{text-align:right;color:var(--muted);font-size:12px;line-height:1.9}
.header-meta .status strong{color:var(--ok);font-weight:600}
.header-meta .status.err strong{color:var(--accent)}
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:1px}
.status-dot.err{background:var(--accent)}
.hero{display:flex;flex-direction:column;justify-content:center;min-height:clamp(200px,28vh,260px);border-bottom:1px solid var(--line)}
.hero-main{padding:clamp(28px,5vw,45px) 0 clamp(26px,4vw,42px);display:flex;flex-direction:column;justify-content:center;gap:clamp(30px,5vw,48px)}
.gauge-name{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:clamp(10px,1.8vw,14px)}
.gauge-name span{font-size:clamp(14px,2vw,17px);font-weight:600}
.gauge-name em{font-style:normal;font-size:clamp(20px,3vw,28px);font-weight:500;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.gauge-track{height:clamp(10px,1.6vw,14px);background:var(--soft-line);border-radius:999px;overflow:hidden}
.gauge-track i{display:block;height:100%;background:var(--ink);border-radius:999px;transition:width .5s ease}
.gauge-track i.warning{background:var(--accent)}
.gauge-foot{margin-top:9px;color:var(--muted);font-size:clamp(11px,1.6vw,12px)}
.hooks{margin-top:clamp(14px,2vw,20px);padding:clamp(14px,2.4vw,18px) clamp(14px,2.4vw,18px) clamp(18px,2.6vw,24px);border:1px solid var(--line);border-radius:10px;background:var(--paper-deep)}
.hooks-title{font:600 clamp(12px,1.8vw,14px) var(--serif);color:var(--ink);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.hooks-title::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);animation:hook-pulse 2s ease-in-out infinite}
@keyframes hook-pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hooks-list{list-style:none;padding:0;margin:0;font:12px/1.6 var(--serif);color:var(--muted)}
.hooks-list li{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed var(--soft-line)}
.hooks-list li:last-child{border-bottom:0}
.hooks-list .h-time{color:var(--muted);font-variant-numeric:tabular-nums;flex-shrink:0}
.hooks-list .h-text{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
@media(max-width:760px){
  .page{padding:26px 22px}
  .header{display:block}
  .header-meta{text-align:left;margin-top:15px}
  .hero-main{padding-bottom:24px}
}
</style>
</head>
<body>
<main class="page">

  <header class="header">
    <div>
      <h1 id="headerTitle">Coding Plan</h1>
    </div>
    <div class="header-meta">
      <div class="status" id="statusMain"><i class="status-dot" id="statusDot"></i><strong id="statusText">API 正常</strong></div>
      <div id="credentialLevelRow" hidden>等级 · <span id="credentialLevelText">--</span></div>
      <div>最后更新 · <span id="updated">—</span></div>
    </div>
    <!-- 右上角供应商切换：点击 ⚙ 展开列表 -->
    <div class="settings-gear" id="settingsGear">
      <button type="button" class="gear-btn" id="gearBtn" title="切换供应商">⚙</button>
      <div class="gear-menu" id="gearMenu" hidden>
        <button type="button" class="gear-item" data-provider="deepseek"><span class="gear-dot"></span>DeepSeek</button>
        <button type="button" class="gear-item" data-provider="minimax"><span class="gear-dot"></span>MiniMax</button>
        <button type="button" class="gear-item" data-provider="zhipu"><span class="gear-dot"></span>ZhiPu GLM</button>
        <button type="button" class="gear-item" data-provider="kimi"><span class="gear-dot"></span>Kimi For Coding</button>
        <button type="button" class="gear-item" data-provider="opencode"><span class="gear-dot"></span>OpenCode Go</button>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-main">
      <!-- 上方：每五小时余额（当前周期 interval） -->
      <div class="gauge">
        <div class="gauge-name">
          <span>每五小时余额</span>
          <em id="intervalPct">--%</em>
        </div>
        <div class="gauge-track"><i id="intervalBar"></i></div>
        <div class="gauge-foot" id="intervalFoot">—</div>
      </div>
      <!-- 下方：每周余额 -->
      <div class="gauge">
        <div class="gauge-name">
          <span>每周余额</span>
          <em id="weeklyPct">--%</em>
        </div>
        <div class="gauge-track"><i id="weeklyBar"></i></div>
        <div class="gauge-foot" id="weeklyFoot">—</div>
      </div>
    </div>
  </section>

  <!-- Claude Code Hook 活动流：最近 5 条 hook 事件 -->
  <section class="hooks" id="hooksSection" hidden>
    <div class="hooks-title">Claude 活动</div>
    <ul class="hooks-list" id="hooksList"></ul>
  </section>

</main>
<script>
"use strict";
var bridge = window.chrome && window.chrome.webview;
function setText(id, t) { var el = document.getElementById(id); if (el) el.textContent = t; }

// 小时 → "3天5小时47分钟"；不足一天的省略"天"
function fmtHMDaysZh(hours) {
  if (hours == null || isNaN(hours) || hours < 0) return "--";
  var totalMin = Math.round(hours * 60);
  var d = Math.floor(totalMin / 1440);
  var h = Math.floor((totalMin % 1440) / 60);
  var m = totalMin % 60;
  var s = "";
  if (d > 0) s += d + "天";
  if (h > 0) s += h + "小时";
  if (m > 0) s += m + "分钟";
  if (s === "") s = "0分钟";
  return s;
}
function warning(pct) { return pct < 30; }

function applyTheme(t) {
  if (!t) return;
  if (t.dark) document.body.setAttribute("data-dark", "");
  else document.body.removeAttribute("data-dark");
  var r = document.documentElement.style;
  r.setProperty("--ink", t.text || (t.dark ? "#ebe9e1" : "#24211d"));
  r.setProperty("--muted", t.weak || "#918f86");
  r.setProperty("--accent", t.accent || "#9b493d");
  r.setProperty("--paper", t.paper || (t.dark ? "#181815" : "#f3efe7"));
}

// provider → 面板标题的映射。配额型 provider (MiniMax/ZhiPu/Kimi) 共用此面板。
var HEADER_TITLES = {
  minimax: "MiniMax Coding Plan",
  zhipu:   "智谱 GLM Coding Plan",
  kimi:    "Kimi For Coding"
};

function render(msg) {
  if (!msg) return;
  applyTheme(msg.theme);
  var d = msg.data || {};
  // 供应商高亮：当前 provider 在下拉列表里打勾
  var provider = d.provider || "minimax";
  var menu = document.getElementById("gearMenu");
  if (menu) {
    var items = menu.querySelectorAll(".gear-item");
    items.forEach(function (b) {
      var isActive = b.getAttribute("data-provider") === provider;
      if (isActive) b.classList.add("active");
      else b.classList.remove("active");
    });
  }
  // 标题：按 provider 查表；非配额型 provider 不应到达此面板（host 会切到 monitor.html）。
  setText("headerTitle", HEADER_TITLES[provider] || "Coding Plan");

  // 套餐等级（ZhiPu data.level = max/pro/...），非 ZhiPu 或空时整行隐藏。
  var credRow = document.getElementById("credentialLevelRow");
  if (credRow) {
    if (d.credentialLevel) {
      credRow.hidden = false;
      setText("credentialLevelText", d.credentialLevel);
    } else {
      credRow.hidden = true;
    }
  }

  var models = d.modelRemains || [];
  var general = null;
  models.forEach(function (m) { if (m.model === "general" && !general) general = m; });
  if (!general && models.length) general = models[0];

  // 状态
  var main = document.getElementById("statusMain");
  var dot = document.getElementById("statusDot");
  main.classList.remove("err"); dot.classList.remove("err");
  if (d.statusKind === "ok") { setText("statusText", "API 正常"); }
  else { main.classList.add("err"); dot.classList.add("err"); setText("statusText", d.status || "异常"); }
  setText("updated", d.updateTime || "—");

  // Claude Code hook 活动流
  renderHooks(d.hooks || []);

  // Hero：聚焦 general —— 双进度条（每五小时 / 每周）+ 重置倒计时
  var ib = document.getElementById("intervalBar");
  var wb = document.getElementById("weeklyBar");
  if (general) {
    var ip = Math.max(0, Math.min(100, general.percent || 0));
    var wp = Math.max(0, Math.min(100, general.weeklyPercent || 0));
    setText("intervalPct", Math.round(ip) + "%");
    setText("weeklyPct", Math.round(wp) + "%");
    if (ib) { ib.style.width = ip + "%"; ib.className = warning(ip) ? "warning" : ""; }
    if (wb) { wb.style.width = wp + "%"; wb.className = warning(wp) ? "warning" : ""; }
    // 每五小时周期（interval）重置倒计时；每周重置则自动带"天"
    setText("intervalFoot", "距离下次重置还有 " + fmtHMDaysZh(general.hours));
    setText("weeklyFoot", "距离下次重置还有 " + fmtHMDaysZh(general.weeklyHours));
  } else {
    setText("intervalPct", "--%");
    setText("weeklyPct", "--%");
    if (ib) { ib.style.width = "0%"; ib.className = ""; }
    if (wb) { wb.style.width = "0%"; wb.className = ""; }
    setText("intervalFoot", "—");
    setText("weeklyFoot", "—");
  }
}

window.__renderBalance = function (msg) { try { render(msg); } catch (e) {} };

// Claude Code hook 活动流：按数组顺序渲染最近 5 条；空数组隐藏整个 section。
function renderHooks(hooks) {
  var section = document.getElementById("hooksSection");
  var list = document.getElementById("hooksList");
  if (!section || !list) return;
  if (!hooks || hooks.length === 0) { section.hidden = true; list.innerHTML = ""; return; }
  section.hidden = false;
  var html = "";
  for (var i = 0; i < hooks.length; i++) {
    var h = hooks[i];
    var txt = (h.summary || h.event || "").toString();
    html += '<li><span class="h-time">' + escapeHtml(h.time || "") +
            '</span><span class="h-text" title="' + escapeHtml(txt) + '">' +
            escapeHtml(txt) + '</span></li>';
  }
  list.innerHTML = html;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" })[c];
  });
}
if (bridge) {
  bridge.addEventListener("message", function (e) { try { render(JSON.parse(e.data)); } catch (e) {} });
  bridge.postMessage({ type: "ready" });
}

// 右上角 ⚙ 供应商切换：点按钮展开/收起列表；点列表项切换；点外部收起
(function () {
  var gear = document.getElementById("settingsGear");
  var btn = document.getElementById("gearBtn");
  var menu = document.getElementById("gearMenu");
  if (!gear || !btn || !menu) return;

  function setOpen(open) {
    menu.hidden = !open;
    btn.classList.toggle("open", open);
  }
  btn.addEventListener("click", function (ev) {
    ev.stopPropagation();
    setOpen(menu.hidden);
  });
  menu.addEventListener("click", function (ev) {
    var t = ev.target;
    if (!t || !t.classList || !t.classList.contains("gear-item")) return;
    var p = t.getAttribute("data-provider");
    if (!p) return;
    setOpen(false);
    if (t.classList.contains("active")) return; // 已是当前
    if (bridge) {
      bridge.postMessage({ type: "switchProvider", provider: p });
    }
  });
  document.addEventListener("click", function () { setOpen(false); });
})();
</script>
</body>
</html>
