<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>API 余额监测</title>
<style>
  :root {
    /* 由宿主主题通过 window.chrome.webview 注入覆盖 */
    --text: #202020;
    --weak: #707070;
    --accent: #b07a31;
    --paper: #fff8e6;
    --dark: 0;
    --font-scale: 1;
    --font: "Microsoft YaHei UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; min-height: 100%; background: transparent; }
  body {
    font-family: var(--font);
    color: var(--text);
    font-size: calc(14px * var(--font-scale));
    user-select: none;
    padding: calc(14px * var(--font-scale)) calc(16px * var(--font-scale)) calc(16px * var(--font-scale));
    overflow-y: auto;
  }

  /* ── 标题行 ── */
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: calc(10px * var(--font-scale)); }
  h1 { font-size: calc(20px * var(--font-scale)); font-weight: 600; }
  .status { display: inline-flex; align-items: center; gap: calc(6px * var(--font-scale)); font-size: calc(13px * var(--font-scale)); color: var(--weak); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #9e9e9e; flex: none; }
  .dot.ok { background: #4caf50; }
  .dot.error { background: #f44336; }

  /* ── 余额 ── */
  .balance-label { font-size: calc(13px * var(--font-scale)); font-weight: 600; color: var(--weak); }
  .balance-row { display: flex; align-items: baseline; gap: calc(7px * var(--font-scale)); margin-top: calc(2px * var(--font-scale)); }
  #balanceValue { font-size: calc(32px * var(--font-scale)); font-weight: 700; line-height: 1.1; }
  #balanceCurrency { font-size: calc(15px * var(--font-scale)); color: var(--weak); }
  .cost-wrap { position: relative; margin-top: calc(4px * var(--font-scale)); }
  .cost-line { font-size: calc(13px * var(--font-scale)); color: #4caf50; cursor: default; }
  .cost-detail {
    position: absolute;
    left: 0; top: calc(100% + 4px);
    background: var(--paper);
    border: 1px solid color-mix(in srgb, var(--weak) 30%, transparent);
    border-radius: 6px;
    padding: calc(6px * var(--font-scale)) calc(10px * var(--font-scale));
    min-width: calc(132px * var(--font-scale));
    z-index: 5;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-6px);
    transition: opacity .18s ease, transform .18s ease, visibility .18s;
  }
  .cost-wrap:hover .cost-detail {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }
  .cost-detail-row {
    display: flex; justify-content: space-between; gap: calc(12px * var(--font-scale));
    font-size: calc(12px * var(--font-scale)); color: var(--text);
    padding: 1px 0;
  }
  .cost-detail-row .cost-date { color: var(--weak); }

  /* ── 风险区 ── */
  .risk-row { display: flex; align-items: center; gap: calc(14px * var(--font-scale)); margin-top: calc(16px * var(--font-scale)); }
  .ring-wrap { position: relative; width: calc(72px * var(--font-scale)); height: calc(72px * var(--font-scale)); flex: none; }
  .ring-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-track { fill: none; stroke: rgba(158,158,158,.30); stroke-width: 5; }
  .ring-arc { fill: none; stroke-width: 5; stroke-linecap: round; transition: stroke-dasharray .2s ease, stroke .2s ease; }
  #riskPct {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: calc(14px * var(--font-scale)); font-weight: 700;
  }
  .risk-info { display: flex; flex-direction: column; gap: calc(5px * var(--font-scale)); }
  #riskState { font-size: calc(15px * var(--font-scale)); font-weight: 600; }
  #riskThreshold { font-size: calc(12px * var(--font-scale)); color: var(--weak); }

  /* ── 用量柱状图 ── */
  .usage { margin-top: calc(18px * var(--font-scale)); }
  .usage-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: calc(6px * var(--font-scale)); }
  .usage-label { font-size: calc(14px * var(--font-scale)); font-weight: 600; color: var(--weak); }
  .range-select {
    font-family: var(--font);
    font-size: calc(12px * var(--font-scale));
    color: var(--text);
    background: transparent;
    border: 1px solid color-mix(in srgb, var(--weak) 40%, transparent);
    border-radius: 6px;
    padding: 2px 6px;
  }
  .custom-range {
    display: flex; align-items: center; gap: calc(6px * var(--font-scale));
    font-size: calc(12px * var(--font-scale)); color: var(--weak);
    margin-bottom: calc(6px * var(--font-scale));
  }
  .custom-range input {
    font-family: var(--font);
    font-size: calc(12px * var(--font-scale));
    color: var(--text);
    background: transparent;
    border: 1px solid color-mix(in srgb, var(--weak) 40%, transparent);
    border-radius: 6px;
    padding: 2px 4px;
  }
  #chart { width: 100%; height: 112px; }
  #chart svg { display: block; }
  .chart-axis, .chart-val, .chart-lbl { font-size: calc(9px * var(--font-scale)); }
  .chart-axis { fill: var(--weak); }
  .chart-lbl { fill: var(--weak); }
  .chart-val { fill: var(--text); font-weight: 600; }
  .chart-bar:hover { fill-opacity: 0.9; }
  .chart-empty { color: var(--weak); font-size: calc(12px * var(--font-scale)); padding: calc(10px * var(--font-scale)) 0; }

  /* ── 更新时间 ── */
  #updateTime { text-align: right; font-size: calc(12px * var(--font-scale)); color: var(--weak); margin-top: calc(14px * var(--font-scale)); }

  /* ── 暗色 ── */
  body[data-dark="1"] .ring-track { stroke: rgba(158,158,158,.22); }
</style>
</head>
<body>
  <header>
    <h1>API 余额监测</h1>
    <div class="status">
      <span id="statusDot" class="dot"></span>
      <span id="statusText">等待数据…</span>
    </div>
  </header>

  <div class="balance-label">可用余额</div>
  <div class="balance-row">
    <span id="balanceValue">—</span>
    <span id="balanceCurrency"></span>
  </div>
  <div id="costWrap" class="cost-wrap">
    <div id="costLine" class="cost-line"></div>
    <div id="costDetail" class="cost-detail"></div>
  </div>

  <div class="risk-row">
    <div class="ring-wrap">
      <svg viewBox="0 0 80 80">
        <circle class="ring-track" cx="40" cy="40" r="33"/>
        <circle id="riskArc" class="ring-arc" cx="40" cy="40" r="33" stroke="#9e9e9e"/>
      </svg>
      <div id="riskPct">--</div>
    </div>
    <div class="risk-info">
      <div id="riskState">等待数据…</div>
      <div id="riskThreshold"></div>
    </div>
  </div>

  <div class="usage">
    <div class="usage-head">
      <span class="usage-label">用量趋势</span>
      <select id="rangeSelect" class="range-select">
        <option value="today">今天</option>
        <option value="yesterday">昨天</option>
        <option value="7d" selected>近 7 天</option>
        <option value="30d">近 30 天</option>
        <option value="month">本月</option>
        <option value="lastMonth">上月</option>
        <option value="custom">自定义</option>
      </select>
    </div>
    <div id="customRange" class="custom-range" style="display:none">
      <span>从</span>
      <input type="date" id="fromDate">
      <span>至</span>
      <input type="date" id="toDate">
    </div>
    <div id="chart"></div>
  </div>

  <div id="updateTime"></div>

<script>
"use strict";
// C# 侧通过 window.chrome.webview.postMessage 推送 JSON，这里接收并渲染。
// 页面自身不发起任何网络请求（CORS 限制），数据全部来自插件 C#。

var $ = function (id) { return document.getElementById(id); };

var RING_R = 33;
var RING_C = 2 * Math.PI * RING_R; // 弧长 周长

function applyTheme(t) {
  if (!t) return;
  var r = document.documentElement.style;
  r.setProperty("--text", t.text || "#202020");
  r.setProperty("--weak", t.weak || "#707070");
  r.setProperty("--accent", t.accent || "#b07a31");
  r.setProperty("--paper", t.paper || "#fff8e6");
  r.setProperty("--font-scale", (t.fontScale || 1) + "");
  document.body.setAttribute("data-dark", t.dark ? "1" : "0");
}

function fmtTokens(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
  return "" + n;
}

function render(msg) {
  if (!msg) return;
  applyTheme(msg.theme);
  var d = msg.data;

  // 状态点
  var dot = $("statusDot"), st = $("statusText");
  if (d.statusKind === "ok") {
    dot.className = "dot ok";
    st.textContent = "在线";
    st.style.color = "#4caf50";
  } else if (d.statusKind === "error") {
    dot.className = "dot error";
    st.textContent = d.status || "错误";
    st.style.color = "#f44336";
  } else {
    dot.className = "dot";
    st.textContent = d.status || "等待数据…";
    st.style.color = "";
  }

  // 余额
  $("balanceValue").textContent = d.hasBalance ? d.balance : "—";
  $("balanceCurrency").textContent = d.currency || "";
  // 近 7 天消费（悬停展开 7 天明细）
  $("costLine").textContent = d.cost7d ? "近 7 天消费：" + d.cost7d : "";
  var costDetail = $("costDetail");
  costDetail.innerHTML = "";
  if (d.cost7d && d.costDays7 && d.costDays7.length) {
    d.costDays7.forEach(function (c) {
      var row = document.createElement("div");
      row.className = "cost-detail-row";
      var date = document.createElement("span");
      date.className = "cost-date";
      date.textContent = c.date;
      var val = document.createElement("span");
      val.textContent = c.costText;
      row.appendChild(date);
      row.appendChild(val);
      costDetail.appendChild(row);
    });
  }

  // 风险环
  var ratio = d.ratio || 0;
  var color = d.riskColor || "#9e9e9e";
  var arc = $("riskArc");
  arc.style.stroke = color;
  if (ratio >= 1) {
    arc.style.strokeDasharray = RING_C + " " + RING_C;
  } else if (ratio <= 0) {
    arc.style.strokeDasharray = "0 " + RING_C;
  } else {
    arc.style.strokeDasharray = (RING_C * Math.max(ratio, 0.014)) + " " + RING_C;
  }
  var pct = $("riskPct");
  pct.textContent = ratio > 0 ? Math.round(ratio * 100) + "%" : "--";
  pct.style.color = color;

  // 风险状态 / 阈值
  $("riskState").textContent = d.riskState || "";
  $("riskState").style.color = color;
  $("riskThreshold").textContent = d.threshold || "";

  // 用量柱状图（保存全量每日数据，由当前时段筛选渲染）
  currentUsage = d.usage || [];
  renderChart();

  // 更新时间
  $("updateTime").textContent = d.updateTime || "";
}

// ── 用量时段：前端从 C# 推来的全量每日数据中按所选时段筛选渲染 ──
var rangeState = "7d";
var customFrom = "";
var customTo = "";
var currentUsage = [];

function fmtDate(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function parseDate(s) {
  var p = s.split("-");
  return new Date(+p[0], +p[1] - 1, +p[2]);
}

// 按当前时段从全量按日数据中筛选出柱状图序列
function collectDays(byDate) {
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var yesterday = new Date(today.getTime() - 86400000);
  var result = [];
  function label(dateStr) {
    if (dateStr === fmtDate(today)) return "今";
    if (dateStr === fmtDate(yesterday)) return "昨";
    return dateStr.slice(8);
  }
  function add(date) {
    result.push({ date: date, tokens: byDate[date] || 0, label: label(date) });
  }
  function between(a, b) {
    for (var d = new Date(a); d <= b; d.setDate(d.getDate() + 1)) add(fmtDate(d));
  }

  switch (rangeState) {
    case "today":
      add(fmtDate(today)); break;
    case "yesterday":
      add(fmtDate(yesterday)); break;
    case "7d":
      between(new Date(today.getFullYear(), today.getMonth(), today.getDate() - 6), today); break;
    case "30d":
      between(new Date(today.getFullYear(), today.getMonth(), today.getDate() - 29), today); break;
    case "month": {
      var f = new Date(today.getFullYear(), today.getMonth(), 1);
      var l = new Date(today.getFullYear(), today.getMonth() + 1, 0);
      between(f, l); break;
    }
    case "lastMonth": {
      var f2 = new Date(today.getFullYear(), today.getMonth() - 1, 1);
      var l2 = new Date(today.getFullYear(), today.getMonth(), 0);
      between(f2, l2); break;
    }
    case "custom":
      if (customFrom && customTo) {
        var a = parseDate(customFrom), b = parseDate(customTo);
        if (a <= b) between(a, b);
      }
      break;
  }
  return result;
}

function renderChart() {
  var box = $("chart");
  box.innerHTML = "";
  var byDate = {};
  (currentUsage || []).forEach(function (u) { byDate[u.date] = u.tokens; });
  var days = collectDays(byDate);
  if (!days.length) {
    box.innerHTML = '<div class="chart-empty">该时段暂无用量数据</div>';
    return;
  }
  var max = 1;
  days.forEach(function (d) { if (d.tokens > max) max = d.tokens; });

  // SVG 布局参数
  var width = Math.max(140, box.clientWidth || 200);
  var padLeft = 46, padRight = 6, padTop = 22, padBottom = 20;
  var plotH = 70;
  var svgH = padTop + plotH + padBottom;
  var plotW = Math.max(10, width - padLeft - padRight);
  var axisX = padLeft - 4;
  var n = days.length;
  var slot = plotW / n;
  var barW = Math.max(1, Math.min(26, slot * 0.55));
  var ns = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(ns, "svg");
  svg.setAttribute("width", "100%");
  svg.setAttribute("height", svgH);

  function line(x1, y1, x2, y2) {
    var l = document.createElementNS(ns, "line");
    l.setAttribute("x1", x1); l.setAttribute("y1", y1);
    l.setAttribute("x2", x2); l.setAttribute("y2", y2);
    l.setAttribute("stroke", "#9e9e9e"); l.setAttribute("stroke-opacity", "0.25");
    l.setAttribute("stroke-width", "1");
    return l;
  }
  function text(x, y, cls, anchor, content) {
    var t = document.createElementNS(ns, "text");
    t.setAttribute("x", x); t.setAttribute("y", y);
    t.setAttribute("text-anchor", anchor); t.setAttribute("class", cls);
    t.textContent = content;
    return t;
  }

  // 纵轴 + 横轴
  svg.appendChild(line(axisX, padTop, axisX, padTop + plotH));
  svg.appendChild(line(axisX, padTop + plotH, width - padRight, padTop + plotH));

  // 纵轴刻度：0 / 50% / 100%（用最大值换算）
  [0, 0.5, 1].forEach(function (t) {
    var y = padTop + plotH - t * plotH;
    svg.appendChild(line(axisX - 4, y, axisX, y));
    svg.appendChild(text(axisX - 6, y + 3, "chart-axis", "end", fmtTokens(Math.round(max * t))));
  });

  // 柱过多时抽稀日期标签；柱超过 10 根时不再渲染柱顶数值，避免重叠
  var labelStep = n > 15 ? Math.ceil(n / 15) : 1;
  var showValues = n <= 10;

  days.forEach(function (d, i) {
    var h = Math.max(2, d.tokens / max * plotH);
    var x = padLeft + i * slot + (slot - barW) / 2;
    var y = padTop + plotH - h;

    // 柱子（带悬停 ToolTip）
    var rect = document.createElementNS(ns, "rect");
    rect.setAttribute("x", x); rect.setAttribute("y", y);
    rect.setAttribute("width", barW); rect.setAttribute("height", h);
    rect.setAttribute("rx", 2); rect.setAttribute("fill", "#4caf50");
    rect.setAttribute("fill-opacity", "0.65"); rect.setAttribute("class", "chart-bar");
    var tip = document.createElementNS(ns, "title");
    tip.textContent = d.date + "\n" + fmtTokens(d.tokens) + " Token";
    rect.appendChild(tip);
    svg.appendChild(rect);

    // 柱顶数值（仅柱子数不超过 10 时显示）
    if (showValues) {
      svg.appendChild(text(x + barW / 2, y - 3, "chart-val", "middle", fmtTokens(Math.round(d.tokens))));
    }

    // 底部日期标签（抽稀）
    if (i % labelStep === 0) {
      svg.appendChild(text(x + barW / 2, padTop + plotH + 14, "chart-lbl", "middle", d.label));
    }
  });

  box.appendChild(svg);
}

// 时段切换 / 自定义日期变化 → 立即重渲染（不重新请求 C#）
$("rangeSelect").addEventListener("change", function () {
  rangeState = this.value;
  $("customRange").style.display = rangeState === "custom" ? "flex" : "none";
  renderChart();
});
$("fromDate").addEventListener("change", function () { customFrom = this.value; renderChart(); });
$("toDate").addEventListener("change", function () { customTo = this.value; renderChart(); });

// 容器尺寸变化（初次布局 / 便签宽度调整）时重绘图表
if (window.ResizeObserver) {
  new ResizeObserver(function () { renderChart(); }).observe($("chart"));
} else {
  window.addEventListener("resize", renderChart);
}

// 暴露给宿主的直调渲染函数（备用通道，绕过 postMessage 监听）
window.__renderBalance = function (msg) {
  try {
    render(msg);
  } catch (err) {
    // 忽略异常消息，保持面板稳定
  }
};

// 接收 C# 推送（主题 + 数据）。WebView2 注入的 window.chrome.webview 通常存在；
// 加防护避免个别环境缺失时脚本中断。
var bridge = window.chrome && window.chrome.webview;
if (bridge) {
  bridge.addEventListener("message", function (e) {
    try {
      render(JSON.parse(e.data));
    } catch (err) {
      // 忽略异常消息，保持面板稳定
    }
  });
  // 页面就绪后通知宿主，宿主收到后立即补发最新数据（不依赖导航完成时序）
  bridge.postMessage({ type: "ready" });
}
</script>
</body>
</html>
